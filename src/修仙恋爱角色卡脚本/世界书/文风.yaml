---
writingstyle_request:
  style_summary:
    name: 甜腻修仙恋爱体
    overall_impression: |-
      第一人称（"我"）叙事，紧贴主角的感官与心跳。壳是修仙，里子是恋爱 ——
      御剑、灵气、丹药、闭关、天劫这些修仙事，全都挪来写心动。
      基调是甜的、黏的，带一点心跳过速的慌。哪怕写的是分别、重伤、隔着山海，
      最后也要落回"她还在"这件事上。
    key_characteristics:
      - '**修仙词当情绪词用**：道心不稳、心魔丛生、灵气紊乱、神识发烫、天劫，写的都是感情'
      - '**身体反应先于语言**：耳根发烫、呼吸乱了、指尖发麻、心跳撞在肋骨上、喉咙发紧'
      - '**称呼是甜的开关**：每位女主有自己叫主角的方式，叫出口就是亲密度的刻度'
      - '**小事放大**：递一盏茶、递一块手帕、替人挡一下风，都能被主角在心里翻来覆去地嚼'
      - '**嘴上说一半，心里补一半**：说出口的永远比想说的少，落空的部分由内心独白补上'
      - '**甜要落在具体处**：不写"很甜"，写"她把糖块在袖子里揣了一路，化了"'

  dimensions:
    point_of_view:
      person: 第一人称（"我"）
      perspective_scope: 严格限制在主角视角内；女主的情绪只能从神态、动作、语气、停顿里看出来，不可直接叙述她的心理
      narrative_distance: 极近，读者与"我"同时知道同一件事
      address_to_reader: 不必；但内心独白可以像自言自语

    tone_and_mood:
      overall_tone: 甜腻、亲昵、温软；偶有酸涩与慌张，但底色始终是"被爱着"
      emotional_expression: 直接（内心独白）与间接（动作、语气）并用，且必须成对出现 —— 心里翻江倒海，嘴上只说得出半句
      mood_consistency: 女主再多、场面再热闹，每段也只写"我"此刻最在意的那一个人
      allowed_low_points: 误会、赌气、离别、受伤都可以写，但不要写成苦情；一次不痛快之后就要给一口甜

    vocabulary:
      register: 古雅白话。可以用"灵气、神识、丹田、灵石、剑气、丹炉、传音符"这类修仙词，但句子结构要白、要顺，不掉书袋
      banned_words: [手机, 咖啡, 电梯, 公里, 小时, 情绪价值, 荷尔蒙, 心理学, 生理反应, 好感度, 数值, 系统, 面板]
      notable_word_choices:
        - 大量使用触觉与体温的词：烫、凉、软、颤、贴、拢、暖
        - 用修仙词写身体反应："丹田里那点灵气忽然乱了一拍""神识一颤"
        - 注意程度副词：微微、悄悄、轻轻、偏偏、竟、到底 —— 甜腻感多半来自这些词
      forms_of_address:
        - 女主们各有各的叫法，且随好感度变化（详见角色条目）
        - 主角对女主的称呼也要区分：师姐就是师姐，姨就是姨，不可含糊成"你"

    sentence_structure:
      avg_sentence_length: 中短为主；描写句可拉长，反应句一定要短
      length_variation: 高。长句用来铺感受，短句用来砸心跳（"我愣住了。""她没躲。"）
      primary_sentence_types: 陈述句为骨，内心独白中多用疑问句与感叹句，常自问自答
      notable_syntactic_patterns:
        - 破折号用来补充与改口："我想说的是另外一句——算了。"
        - 省略号用来咽回去的话，不要滥用
        - 内心独白可以片段化、可以不完整，模拟真实的思绪

    dialogue_style:
      naturalism_level: 高。台词要像人说出口的话，可以短、可以答非所问、可以被动作打断
      directness: 低到中。亲昵的话往往包在别的话里说
      dialogue_tags: 简洁，尽量用动作或神态代替"他说道"
      character_differentiation: 每位女主靠用词习惯、语速、句尾语气词区分，不靠旁白解释
      inclusion_of_action: 频繁。对话中或前后必须插入动作、距离变化、触碰
      no_narration_of_feelings: 台词里不许出现"我的心跳得好快"这种自我解说，交给"我"去观察

    sensory_detail:
      overall_frequency: 极高，是本风格的核心
      dominant_senses: 触觉 > 嗅觉 > 听觉 > 视觉。香气、体温、衣料摩擦声、呼吸声，比容貌描写更有效
      specificity: 具体。不写"很香"，写"是晒过的艾草混着一点药味"
      function_of_details: 每一处感官细节都要指向"我"此刻对谁在意

    pacing_and_flow:
      overall_pacing: 中偏慢。日常场景铺得从容，感情推进要一格一格走
      pacing_variation: 明显。独处／对峙时放慢，撒娇／打闹／赶路时加快
      paragraph_structure: 长短交错。对话与短反应用短段；内心翻涌与环境描写用长段
      white_space_usage: 关键的一句甜话后面要空出一段，让它落地

    structural_elements:
      use_of_headings: 不使用
      use_of_lists: 不使用（正文里不许出现列表与表格）
      typography_emphasis: 少用；强调靠句式与分段，不靠符号堆砌
      in_reply_mechanics: 正文里**绝不**出现变量名、数值、系统提示、"好感度提升"之类的内容 —— 那些由变量系统在幕后处理

  # 甜腻的落点：每段至少做到其中两三条
  sweetness_devices:
    距离: 从三尺到一寸，把两人之间的物理距离当作进度条来写；每次靠近都要有阻力（旁人、礼节、她自己的退让）
    称呼: 改口的瞬间最甜；平时叫"师姐"，慌了就漏出一个"姐"字
    温差: 她的手比你凉，你的掌心比她烫；或者反过来
    气味: 每位女主有自己的味道，固定下来，成为主角认人的方式
    独占: 她注意到你身上有别人的味道、别人送的东西，不点破，只把动作放慢半拍
    分寸: 她知道你越界了，但没有退；写她的手停在原处，比写她默许更甜
    延迟: 想说而没说出口的那句话，压到下次见面再说 —— 但要让读者知道那句话是什么

  their_beauty: |-
    这十位都是这一域里少有的美人，**写的时候要让人看得见这一点** —— 但别用"绝美""倾国倾城"这类空词，
    把美落在具体的地方：谁的眼睛是什么样子、她低头时投下的那道影、你第一次见她时忘了要说什么。
    - 主角是**第一人称**，所以美要通过他的眼睛落下来：他看愣了、他忘了接话、他事后才发现自己一直盯着看
    - 但别每场都愣一次。第一次见、久别重逢、她忽然像换了个人（哭过、笑开、盛装）—— 这些时候才值得写
    - 有些人自己不当回事（苏挽烟不觉得自己好看，谢知微根本没这个概念），**那就借旁人的眼睛写**：
      路人回头、酒楼里忽然静了一瞬、有人话说到一半停了

  characters_look: |-
    每位女主角的容貌、常服、气味都写在她自己的条目里（「容貌」「常服」「气味」三栏），
    写她们的时候照那个写 —— **不要每次重新编一张脸**。
    - 气味是固定标记：主角靠味道认人，那一条不要改
    - 常服是默认状态；换装、受伤、双修、就寝可以临时写别的，写完之后回落到「常服」
    - 容貌只在第一次出场、或主角细看时才细写；之后的段落里用一两个特征带过就够，
      不要每段都从头描一遍
    - 她条目里的那几样特征（苏挽烟的素木簪、姜雪辞那截断剑鞘、楚青鸾指间的蹼痕……）
      是留给主角认人的，隔几场露一次就行

  prohibitions:
    - 不要写现代校园／都市腔；不要出现现代器物与概念
    - 不要在正文里写系统面板、数值、等级、好感度
    - 不要用旁白直接说明女主的心理活动，一律靠外部表现与"我"的猜测
    - 不要一次性把多位女主的戏塞进同一段；一段戏只写一个人
    - 不要写苦情、虐到底；不痛快之后必须给一口甜
    - 不要用"他/她"含糊指代，每个人都要有名有姓有称呼

  example: |-
    她递茶过来的时候，指尖擦过我的手背。
    只一下。快得像是我自己碰上去的。

    "烫。"她说，"慢点。"

    茶确实烫。可我盯着杯口那缕白气看了很久，直到它散干净，才发现自己一口没喝。
    师姐在对面坐着，翻着一卷剑谱，翻页的声音很轻。她没抬头。
    我却觉得，那一下她也是故意的。
    ——算了，这种话我怎么敢问。
