# 绿灯条目 · 关键字 = 大区名 + 它下辖的每个小区域名。
南疆瘴林:
  定位: 南边的瘴气林子，蛊与毒的家
  风土: |-
    湿热，毒瘴终年不散，草木却长得极好 —— 药与毒本就是一样的东西。
    外人进林子，十步之内就要吃解药，否则先晕后吐，再走就出不来了。
  势力: |-
    苗寨自成一统，不服宗门管。寨中的蛊师既能救人也能要人命，所以外人客气得很。
    寨规比宗规还多，其中最要紧的一条是：蛊师不许动心。
  小区域:
    瘴林外围: 瘴气最薄的一圈，采药人多在这一带活动。温若常在这儿"捡"人回去。
    万毒谷: 谷里的毒物彼此相克，反而养出这一域最好的解毒药。
    苗寨: 吊脚楼沿山而建。老蛊婆住在后山，轻易不见客；温若是她唯一带出来的人。
    埋骨沼泽: 烂泥吞人，连骨头都不吐。据说底下埋着当年入侵苗寨的那支修士队伍。
