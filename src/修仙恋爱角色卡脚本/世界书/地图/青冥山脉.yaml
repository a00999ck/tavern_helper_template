# 绿灯条目 · 关键字 = 大区名 + 它下辖的每个小区域名。
# 主角走到哪里、或者对话里提到哪里，这一段才会注入。
青冥山脉:
  定位: 主角出身的宗门所在，也是他眼下过日子的地方
  风土: |-
    终年多雨的山脉，半山以上长年被云气裹着，石头缝里往外渗水，所以崖叫"听雨"。
    灵气中上，不算洞天福地，但在这一域也排得上号，故而宗门设在这里已近千年。
  势力: |-
    青冥山一宗独大，分内门、外门。外门弟子上千，做的是药圃、灶房、巡山这类差事，修行全靠自己挤时间；
    内门弟子不足百人，有师长指点、有丹药供给。两个世界，中间隔着一道腰牌。
  小区域:
    山门牌楼: 三丈高的青石牌楼，匾上"青冥"二字据说是开山祖师亲手刻的。外客一律要在此登记。
    外门演武场: 一大片夯土场子，立着几排木桩。天不亮就有人在这儿练剑，夜里也有人偷偷来。
    听雨崖: 崖下有一片药圃，崖上常年滴水。外门弟子当值时最爱躲在这儿，因为执事巡不到。
    后山药圃: 宗门自己种的灵草，分畦而作。三七、止血草这类最普通的药都出自这里。
    藏经阁: 三层木楼，外门弟子只准上第一层，第二层往上要内门腰牌。
    祖师祠堂: 供着历代掌门的牌位，平日冷清。有人被逐出师门时，在这里除名。
