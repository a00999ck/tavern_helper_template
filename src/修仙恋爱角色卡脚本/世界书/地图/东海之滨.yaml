# 绿灯条目 · 关键字 = 大区名 + 它下辖的每个小区域名。
东海之滨:
  定位: 最东边，海与仙舟
  风土: |-
    潮声日夜不息。海上灵气散而不聚，修士在这里修行比内陆慢，但好处是没规矩 ——
    想干什么都没人管，所以亡命的、寻宝的、避仇的都往海上跑。
  势力: |-
    渔港的船帮、海上的散修，还有那座神出鬼没的仙舟。
    仙舟到哪个港，哪个港的物价就要抖三抖。
  小区域:
    渔港码头: 几百条渔船和几十条修士的船挤在一起。白蘅的仙舟常泊在港口外三里。
    断崖剑冢: 崖上插满了剑，都是死在海上、被人把剑送回来的剑修留下的。没人敢动。
    海上仙舟: 一座会走的楼船，什么都有得谈：法器、丹方、消息，还有别人的过去。白蘅是船主。
    潮音洞: 洞里听潮，能听见很远的海面。柳眠在这里住了二百年，听得出一艘船是来做什么的。
