# 绿灯条目 · 关键字 = 大区名 + 它下辖的每个小区域名。
云梦泽:
  定位: 南边的大泽，水气与灵气都重，散修聚集之地
  风土: |-
    千里水泽，芦苇与雾气。日头出来时白茫茫一片，船行其中常分不清方向。
    水下沉着旧龙宫的废墟，岸上是渔村与大大小小的散修棚屋。
  势力: |-
    没有大宗门。明面上的规矩由几个老修士说了算，谁拳头大听谁的。
    但真正压着这一片的是渡口往西三里那位 —— 化神的顾清漪。她从不理事，
    所以外人多半只当她是个不好惹的隐修，只有几个老人清楚这一带的天花板在哪。
    也正因如此，什么人都能在这儿落脚 —— 想避祸的、想发财的、不想被人认出来的。
  小区域:
    泽畔渡口: 来往云梦泽的必经之地，船家在这儿揽客。顾清漪的临水小院在渡口往西三里。
    芦花荡: 一人多高的芦花，船进去就找不着人。常有人在这儿做见不得光的买卖。
    渔村: 几十户打鱼的人家，也替修士采些水里的灵物。村里人不问来客是谁。
    水底龙宫废墟: 沉在水下的一片旧宫殿，断柱上还刻着龙纹。楚青鸾守在这里，谁靠近先吃她一记水箭。
