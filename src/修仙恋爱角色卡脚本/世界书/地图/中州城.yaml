---
# 绿灯条目 · 关键字 = 大区名 + 它下辖的每个小区域名。
中州城:
  定位: 这一域最大的城，人也杂、货也杂
  风土: |-
    城墙高三丈，城里分坊市、酒楼、拍卖行。凡俗与修士同住，谁也不碍着谁 ——
    规矩简单：进了城就收手，动了手就没人护得住你。
  势力: |-
    城主府管凡俗的事，修士的事由几位客卿商议。
    苏挽烟就在客卿之列，只是十几年没露过面，城里大多数人只当这是个挂名的闲职。
    城主府知道得比城里人多 —— 那位客卿的分量，府里上下心里都有数，只是从不多问一句。
  小区域:
    城门坊市: 进城第一条街，什么都有得卖，真假都有。想捡漏和想骗人的在这里一样多。
    万宝拍卖行: 每月一场大拍。裴小满管库，哪年哪月哪件东西被谁买走、什么价，问她就够。
    悦来客栈: 中州城最好的客栈，也是消息换得最快的地方。掌柜不问客人来路。
    城主府: 城中最深的一处宅子。苏挽烟客居于此，前院栽着一棵她亲手种的桃树。
