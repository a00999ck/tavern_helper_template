# 绿灯条目 · 关键字 = 大区名 + 它下辖的每个小区域名。
北荒雪原:
  定位: 极北之地，人与剑都比别处硬
  风土: |-
    一年有大半年落雪，灵气凛冽，妖兽比人多。这里出寒铁，也埋着不少尸骨。
    在这儿走夜路的人都知道：看见火光别急着过去，火边坐着的未必是人。
  势力: |-
    散修的边地。有护道的商队，有劫道的马匪，也有像姜雪辞这样不肯走的独居剑修。
    宗门的手伸不到这里，所以什么规矩都是现打现立的。
  小区域:
    雪原边镇: 雪原上唯一的镇子，几十间石屋挤在一起取暖。姜雪辞住在镇子最北头。
    冰封古道: 商队走的道，道旁埋着历年冻死的人和牲口，雪化时会露出来。
    狼牙谷: 雪狼的老巢。谷口至今挂着十几把断剑，都是想猎狼反被猎的人留下的。
    极北冰窟: 越往里灵气越浓，也越冷。传说窟底封着上古的东西，去过的人没回来过。
