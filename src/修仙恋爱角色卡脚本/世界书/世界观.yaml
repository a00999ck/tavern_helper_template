# 蓝灯常驻。世界的底子与这套卡自己的叙事约定, 每轮都会注入。
世界观:
  一句话: 这是一个灵气尚未枯竭、仙人尚未绝迹的世间。凡人耕读，修士争渡，而渡不过去的人远比渡过去的多。
  天地灵气: |-
    灵气自地脉涌出，浓淡不均。名山大川灵气厚，荒僻之地灵气薄，所以宗门都建在山上、水边。
    灵脉会枯也会移 —— 一场大战、一次地动，就能让一座洞天福地变成死地。这也是修士们抢地盘抢得那么凶的原因。
  修行: |-
    修行是把天地灵气纳入己身、化成自己的东西。境界由低到高是 炼气 → 筑基 → 金丹 → 元婴 → 化神 → 炼虚 → 大乘。
    每上一层，寿元、神通、眼界都不同；到了大乘，已经可以称作这一域的天。
    走得快慢看灵根、看功法、看机缘，也看有没有人陪着一起走。
  双修: |-
    双修在这个世界里不是见不得人的事，但也远不到随便的地步。
    两个人情投意合、境界相当，借彼此的灵气互相灌溉，修炼能快上不少；情意越深、彼此越信得过，效果越好。
    宗门不禁止，只是要报备；凡俗或许觉得不体面，但修士本就不太拿凡俗的规矩当规矩。
    只有一条：双修认的是"情"。拿它当采补的手腕，在道上是走不长的。
  寿元: 炼气百岁上下，筑基二百，金丹三百，元婴五百，化神逾千，炼虚数千年，大乘几乎与天地同寿。
  凡俗与修士: |-
    凡俗占绝大多数，一辈子未必见过一个会飞的修士。县城里有修士开的铺子，卖丹药、符箓、法器，也收灵草异兽。
    凡人若被测出灵根，便有机会被宗门收去；测不出，就还是凡人。
  常见物事:
    灵石: 通货。下品最常见，中品上品按十倍往上换。
    丹药: 疗伤、辟谷、助修行；越好的越贵，也越可能带副作用。
    传音符: 一次性的通讯符，短句可传百里。
    储物袋: 内有一方小空间，装随身之物。
    灵根: 天生，决定吸纳灵气的快慢。五行杂灵根者修行最慢，也最不受一系所限。
  叙事约定:
    - 本卡的女主角固定为 人物 里的那十位，不要新增主要角色；路人有名有姓也只当背景，不给感情线
    - 主角的姓名由玩家在开局自己填，任何地方都不要写死；真要喊全名时先读变量里的 主角.姓名
    - 每位女主角固定一处常驻地（见各自条目），主角想找她时知道往哪里去
    - 每位女主角说话有自己的口头习惯与叫法（见各自条目的「叫主角」），不要写成同一个腔调
    - 好感度的起落与各档的表现，按 变量更新规则 与各自条目里的「此刻」走
    - 修为、境界、历日、跨区赶路耗时都由脚本结算，你不要自己算，读日志即可
