# yaml-language-server: $schema=../../schema.json
# 在编写 initvar 之前, 请先保证终端有在运行 `pnpm watch`, 这会生成 schema.json 用于检验 initvar 是否有效
#
# 主角姓名与灵根由「开局流程」脚本向玩家询问后写入, 所以这里留空.
# 人物: 这张卡固定的十位女主角全部先写进来, 免得 AI 另造角色.
#   前三位是主角本来就认得的(母亲、姨、青梅师姐), 情愫照写;
#   其余七位还没遇上, 情愫先留空, 等见面后由 AI 填.
#   各人的年岁感、性格要素、来历、叫法见 世界书/角色/女主角.yaml.
世界:
  # 自大衍历元年正月初一起算的第几天; 795 = 大衍历三年 三月初七
  历日: 795
  时段: 暮色
  当前大区: 青冥山脉
  当前地点: 听雨崖
  天气: 细雨
  # 背景留空即自动用当前大区那张(素材/背景/青冥山脉.png); 想在同区换特写时才填文件名
  背景: ''
  # 事件 CG 的文件名, 对应 素材/CG/<名字>.png; 没有就留空
  CG: ''
  CG说明: ''
  # AI 每轮报告经过了多少天(不含跨区赶路), 「世界推进」脚本读完会清零
  经过天数: 0
  近期事务: {}
  _移动日志: ''

主角:
  姓名: ''
  道号: ''
  身份: 青冥山外门弟子
  # 境界与修为都由「世界推进」脚本提升, 这里只给起点
  境界: 炼气
  # 只存文件名, 对应 素材/立绘/主角.png; 图没放进去之前界面显示水墨占位
  立绘: 主角
  简介: ''
  修为: 0
  # 名称留空表示还没走开局流程; 倍率先按中性的 1 计, 选定后由脚本改写
  灵根:
    名称: ''
    倍率: 1
    描述: ''
  功法: {}
  双修: {}
  状态: {}
  物品栏: {}
  _修行日志: ''

人物:
  苏挽烟:
    身份: 中州城城主府客卿
    境界: 大乘
    立绘: 苏挽烟
    简介: 中州城里最不起眼的一位女修，也是这一域最深的一口井。主角的生母，一辈子只放不下他一个。
    好感度: 85
    情愫: 我这一生没求过什么，只想他好好的。……可他若想要别的，我又怎么舍得说不。
    关系: 母亲
    心结: 那团灵气究竟是什么，她至今不敢深究，也怕主角问起自己的来处。
  顾清漪:
    身份: 云梦泽散修
    境界: 化神
    立绘: 顾清漪
    简介: 母亲同门学艺的师妹，主角唤她一声姨。嘴上从不饶人，手里总塞着最好的丹药。
    好感度: 62
    情愫: 师姐的儿子，一年比一年像样了。……我这是在想什么。
    关系: 姨
    心结: 师姐出事那年她在外游历，若早回来半日，会不会不一样。
  云见月:
    身份: 青冥山内门弟子
    境界: 筑基中期
    立绘: 云见月
    简介: 顾清漪收养的女儿，主角的青梅竹马。比他早两年入青冥山，一直在等他跟上。
    好感度: 58
    情愫: 小时候说好一起进内门的。我先进来了，可别让我等太久。
    关系: 师姐（青梅）
    心结: 娘说她是捡来的。那她原来的家、原来的姓，究竟是什么。
  姜雪辞:
    身份: 北荒边镇的护道剑修
    境界: 金丹后期
    立绘: 姜雪辞
    简介: 北荒雪原独居的剑修，佩剑断于一场雪崩，从此背上"灾星"二字，谁都近不得。
    好感度: 22
    情愫: ''
    关系: 素未谋面
    心结: 那把断剑她一直收在柜子最底层，从没让人看过。
  温若:
    身份: 南疆苗寨蛊师
    境界: 筑基后期
    立绘: 温若
    简介: 苗寨最年轻的蛊师，笑起来眼睛弯弯的，说话又软又慢，最擅长在人最不设防处埋一句话。
    好感度: 18
    情愫: ''
    关系: 素未谋面
    心结: 寨规写着蛊师不许动心，可这条规矩她现在越看越不顺眼。
  谢知微:
    身份: 青冥山外门弟子
    境界: 炼气九层
    立绘: 谢知微
    简介: 与主角同年入的外门弟子。辨药比谁都快，记自己昨天把剑放哪儿却怎么也想不起来。
    好感度: 45
    情愫: 今天跟师弟一起挑水，水洒了一半……但是很开心。为什么呢。
    关系: 同门（外门）
    心结: 师父总说她记性差，其实每一件小事她都记得清清楚楚。
  白蘅:
    身份: 东海仙舟主人
    境界: 炼虚
    立绘: 白蘅
    简介: 会走的楼船"仙舟"之主。什么都有得谈，谈什么都笑，笑里从不给你把柄。
    好感度: 12
    情愫: ''
    关系: 素未谋面
    心结: 仙舟是她的，可这海上的东西，没有一样是真属于她的。
  裴小满:
    身份: 万宝拍卖行管库
    境界: 炼气五层
    立绘: 裴小满
    简介: 在柜台底下长大的孩子。算盘打得慢，账却记得比谁都准，只是没人信她。
    好感度: 35
    情愫: ''
    关系: 素未谋面
    心结: 掌柜的一直说她算不清账，可每一笔她都数得明明白白。
  楚青鸾:
    身份: 水底龙宫末裔
    境界: 金丹
    立绘: 楚青鸾
    简介: 守着云梦泽水底一片残垣的龙宫遗族。张口就是"你们凡人如何如何"，仿佛还坐在龙庭上。
    好感度: 20
    情愫: ''
    关系: 素未谋面
    心结: 一族只剩她一个，连个说话的人都没有过。
  柳眠:
    身份: 潮音洞主人
    境界: 元婴
    立绘: 柳眠
    简介: 身形娇小、看着比年岁小上许多，实则已两百余岁的元婴修士。开口就是软软的大哥哥。
    好感度: 15
    情愫: ''
    关系: 素未谋面
    心结: 二百年了，没人认真待过她，全当她是孩子。
