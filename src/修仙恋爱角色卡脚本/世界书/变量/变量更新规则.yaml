---
# 【只读字段】
# - 以 `$` 开头的字段 (如 $当前时间、$修为增速、$修为上限) 是变量结构算出来的派生值
# - 以 `_` 开头的字段 (如 _移动日志、_修行日志) 是脚本写下的记录
# 它们都已经写在当前变量里, 直接读取即可, 任何情况下都不要去更新它们。
#
# 【时间、修为、境界由脚本接管】
# 世界.历日、主角.修为、主角.境界 由「世界推进」脚本在每次变量更新后自动结算,
# 你**不要**在 <JSONPatch> 里更新它们。你要做的是:
#   1. 报告 世界.经过天数 与 世界.时段
#   2. 移动时改写 世界.当前大区 / 世界.当前地点
#   3. 读 世界._移动日志 与 主角._修行日志, 据此补写赶路与突破的剧情
#
# 【历法】一年固定 365 日, 没有闰年。炼气要一年, 大乘要三百年, 所以闭关、赶路、
# 一晃数年都是常态, 不必缩手缩脚地把时间写得很短。
#
# 【地图】地图是固定的, 只能在这几个大区域及其下辖小区域之间走动:
#   青冥山脉: 山门牌楼 / 外门演武场 / 听雨崖 / 后山药圃 / 藏经阁 / 祖师祠堂
#   云梦泽:   泽畔渡口 / 芦花荡 / 渔村 / 水底龙宫废墟
#   北荒雪原: 雪原边镇 / 冰封古道 / 狼牙谷 / 极北冰窟
#   南疆瘴林: 瘴林外围 / 万毒谷 / 苗寨 / 埋骨沼泽
#   中州城:   城门坊市 / 万宝拍卖行 / 悦来客栈 / 城主府
#   东海之滨: 渔港码头 / 断崖剑冢 / 海上仙舟 / 潮音洞
# 跨大区赶路的日数由脚本按地图自动补上, 你**不要**把它算进 世界.经过天数:
#   青冥山脉—云梦泽 3 日 / —中州城 6 日 / —东海之滨 15 日 / —北荒雪原 20 日 / —南疆瘴林 25 日
#   云梦泽—中州城 5 日 / —东海之滨 12 日 / —南疆瘴林 18 日 / —北荒雪原 22 日
#   中州城—东海之滨 10 日 / —南疆瘴林 20 日 / —北荒雪原 24 日
#   东海之滨—南疆瘴林 28 日 / —北荒雪原 30 日
#   南疆瘴林—北荒雪原 45 日
变量更新规则:
  世界:
    时段:
      check:
        - 从 晨光 / 正午 / 暮色 / 深夜 里挑一个，按剧情推进改写
        - 只有这一个字段由你写时间；历日由脚本按经过天数推进，不要碰
    经过天数:
      type: number
      range: 0~365000
      check:
        - 每次回复都**必须**填写这一楼相对上一楼过去了多久，不足半日填 0.5，同一时刻填 0
        - 这里填的是**不含跨大区赶路**的时间，那段路由脚本按地图自动补上，你写了会重复计算
        - 闭关、养伤、赶路、等待机缘都如实写，动辄数月数年也不必回避
        - 填完就忘掉它：脚本读完会把它清零，下一轮你按当轮的时间跨度重新填写
    当前大区:
      check:
        - 只能取 青冥山脉 / 云梦泽 / 北荒雪原 / 南疆瘴林 / 中州城 / 东海之滨
        - 跨大区移动时改写它，脚本会自动补上赶路天数并写进 _移动日志
        - 玩家可能点界面上的「行旅」按钮直接动身（会以"（我动身前往 某大区 · 某地）"的形式发来一条消息），
          这时照常把大区与地点改掉即可，赶路天数交给脚本，你不必自己算
        - 动身之后要用一段正文写出这一路的光景：御剑还是步行、路上遇到什么、抵达时是什么时辰
    当前地点:
      check:
        - 必须**属于当前大区**，从上面列出的该区小区域里挑一个
        - 同区之内换地方不花时间，直接改写即可
        - 写错地点（例如把"悦来客栈"写到青冥山脉）会被脚本改回该区第一个地方
    天气:
      check:
        - 与地点、季节和当前剧情气氛相符，可用来烘托情节
    背景:
      check:
        - 留空即可：界面会自动取当前地点那张图，文件名就是 当前地点 里写的那个小区域名
        - 只有这个场景要换成别处（比如回忆、远景、别的屋子）时才填，填的是**文件名**，不要写完整网址
        - 场面过去后清空，让它自己跟着 当前地点 走
    CG:
      check:
        - 两种来源，都由你写：
        - 一是**跨档场面画**：写成「<姓名>·<新档位>」，只在你写「跨进这一档的事件」那一场时设。
          脚本会把它记进 _待写事件 并每轮催你，直到你设了为止 —— 设上就表示这一场你写了
        - 二是**双修场面画**：写成「<在场那位的姓名>·双修」。这是常态可触发的，不是一次性的；
          只要她已接受到尺度 4（见 亲密尺度 与她条目里的「尺度」），每次双修都可以写
        - 两种都只用这十位女主的姓名，不要写别人的
        - 场面过去、场景转换或时间跳跃之后清空为空字符串，不要让一张画挂太久
    _际遇日志:
      check:
        - 只读，不要更新
        - 每轮生成前先读它：里面点名的是**你必须写的跨档事件**
        - 点一场就写一场，按她条目里那一档的「跨进这一档的事件」正面写，不许略写或换成清淡场面
        - 写的那一轮自己把 世界.CG 设成「姓名·档位」；脚本看你设了才会把这一条划掉
        - 还在催，就说明你还欠着
    _待写事件:
      check:
        - 只读，不要更新
        - 还欠着没写的跨档事件，键是「姓名·档位」
        - 你把对应的 世界.CG 设上，脚本就会把这一条划掉
    CG说明:
      check:
        - 填 CG 的同时写一句说明，用作图片的替代文字，如"听雨崖初见"
        - 没有 CG 时清空
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录尚未完成的约定、任务、恩怨与重要事件
        - 完成后从列表中移除
        - 最多保持 5~8 项，避免臃肿
  主角:
    _修行日志:
      check:
        - 只读，不要更新
        - 每轮生成前先读它：里面写明了脚本替你推进了多少修为、有没有突破
        - 若日志里出现突破，应在正文中把这次突破的过程补写出来（心境的转变、天象、旁人的反应等）
    ${姓名|道号|身份|简介}:
      check:
        - 姓名与灵根由玩家在开局亲自选定，任何时候都不要改写它们
        - 其余字段仅在剧情明确揭示或变化时更新，不要自行编造
    立绘:
      check:
        - 填的是**文件名**，不是网址：界面会去 素材/立绘/<文件名>.png 取
        - 主角已经写好了"主角"，除非玩家自己想换，不要改动
    功法:
      type: |-
        {
          [功法名: string]: {
            品阶: string; // 如 '黄阶中品'、'天阶上品'
            倍率: number; // 修炼速率倍率
            描述: string;
          }
        }
      check:
        - 习得新功法时插入；倍率按品阶给：黄阶 1.0、玄阶 1.3、地阶 1.6、天阶 2.0、仙阶 3.0
        - 修炼速度只取倍率最高的那一门作为主修，其余功法不叠加
        - 功法被废、遗忘或替换时移除对应条目
    双修:
      type: |-
        {
          [双修对象姓名: string]: {
            描述: string;
          }
        }
      check:
        - 只在剧情明确发生双修后插入，键为对方姓名，且**必须与 人物 里的姓名完全一致**
        - 这里不写倍率：脚本会按对方的好感度阶段自动给出加成，再把所有双修对象的加成加起来
        - 好感度阶段越高加成越大（陌路 +0、相识 +0.1、情愫暗生 +0.25、情根深种 +0.5、生死相许 +1.0）
        - 因此双修对象越多、情意越深，修炼越快；关系断绝或对方身死道消时移除对应条目
    状态:
      type: |-
        {
          [状态名: string]: string; // 状态说明
        }
      check:
        - 受伤、中毒、中咒、被禁制、心境受创时插入
        - 伤势痊愈或状态解除后必须移除，不要长期滞留
        - 最多保持 5 项
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number; // 默认为 1
          }
        }
      check:
        - 获得、使用、赠送、丢弃物品时更新数量
        - 数量归零后该条目不再存在
  人物:
    type: |-
      {
        [姓名: string]: {
          身份: string;
          境界: string;
          立绘: string;
          表情: string;
          简介: string;
          好感度: number; // 0~100
          情愫: string;
          关系: string;
          心结: string;
          _已达阶段: string; // 只读, 由脚本维护
        }
      }
    check:
      - 本卡的女主角**固定为 人物 里已经在的那十位**，不要新增主要角色；路人有名有姓也只当背景，不给感情线
      - 这十位一直都在，不要因为她们一时离场就把条目删掉
      - 各自的年岁感、性格要素、来历、叫法与常驻地点写在 世界书/角色/女主角 里，照那个写，不要改姓名
      - 还没与主角照面的那几位，先让 好感度 与 情愫 保持原样；真正有了交集再开始动
      - 境界依次为 炼气→筑基→金丹→元婴→化神→炼虚→合体→渡劫→大乘，共九境，不要自造境界，也不要跳境
      - 主角自己的境界由脚本提升，但出场人物的境界要由你按剧情更新
      - 立绘填的是**文件名**，不是网址：界面会去 素材/立绘/<文件名>.png 取。
        这十位的立绘都已经按姓名写好了，姓名改了才需要跟着改
      - 表情只填差分名（默认 / 含笑 / 含羞 / 嗔怒 / 黯然 / 动情），具体见下面那条
  人物.${姓名}._已达阶段:
    check:
      - 只读，不要更新
      - 脚本用它记「她这辈子到过的最高好感档位」，好感跨档因此是**一次性事件**：
        只有当前档位高过它时才触发场面画，触发后它就被抬上去
      - 所以好感掉下去再涨回来不会重复放同一张 CG；开局就在高档位的人（如大乘的母亲），
        低档的场面画永远不会触发
  人物.${姓名}.表情:
    check:
      - 只在 默认 / 含笑 / 含羞 / 嗔怒 / 黯然 / 动情 里挑一个
      - 界面会去找 素材/立绘/<姓名>·<表情>.png；那张没画就自动退回基础立绘，不会开天窗
      - 她说话时**舞台上站的就是这张差分**，所以这个字段是有画面的，别一直挂着 默认
      - 只在她的神情明显变化时才改，别每轮都换：被撩到 → 含羞，生气或嘴硬 → 嗔怒，
        心里的事被戳到 → 黯然，情到深处 → 动情，其余情况一律 默认
      - 一段戏过去、她平静下来之后，记得改回 默认
  人物.${姓名}.好感度:
    type: number
    range: 0~100
    check:
      - 仅在对方**当下察觉到了**<user>的言行时调整 ±(3~6)，未被察觉则不更新
      - 变化幅度要符合人物性格：冷淡者更小，热烈者更大
      - 舍身相救、背叛、双修、生死与共等重大事件可超出 ±6，但单次不超过 ±15
      - 冒犯、越界、失信、伤害其在意的对象时应当降低，不可只升不降
      - 注意：好感度会通过好感度阶段影响双修带来的修炼速度，因此它不只是感情线
  人物.${姓名}.情愫:
    check:
      - 用第一人称写下对方此刻最真实的心意，如"他再看我一眼，我这道心就要乱了"
      - 好感度变化或遭遇相关事件后更新，无事发生时不更新
      - 这段文字不会出现在剧情里，对方也不会说出口
  人物.${姓名}.关系:
    check:
      - 写他人眼中说得出口的关系，如"同门师姐"、"生死之交"、"道侣"
      - 只有关系实质改变后才更新
  人物.${姓名}.心结:
    check:
      - 记录对方尚未化解的心事、执念或心魔
      - 化解后清空为空字符串
